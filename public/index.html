    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Two values so the mobile browser chrome follows the page rather than
         sitting in a light bar above a dark UI. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f7f8fa"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b0e16"
    />

    <meta
      name="description"
      content="Serverless employee check-in on AWS: presigned S3 uploads, Rekognition face matching, and DynamoDB, deployed with SAM."
    />

    <!-- Link previews, for when the URL is pasted somewhere. -->
    <meta property="og:title" content="Facial Recognition Check-In" />
    <meta
      property="og:description"
      content="Serverless employee check-in on AWS: presigned S3 uploads, Rekognition face matching, and DynamoDB, deployed with SAM."
    />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Facial Recognition Check-In</title>
  </head>
